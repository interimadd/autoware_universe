# Evaluation config for the x2 vehicle (sensor kit v4.4, camera6/camera7).
#
# Run with:
#   ros2 run autoware_traffic_light_pipeline run_traffic_light_recognition_evaluation \
#     --config <this file> \
#     --dataset <t4dataset dir> \
#     --output-bag result/output_bag
#
# Every tuned value is read from this package's own config/traffic_light_recognition.param.yaml and
# config/traffic_light_fusion.param.yaml -- the same files the launch files feed the two Nodes --
# and cannot be set here. This file carries only what those cannot: which cameras/topics this
# dataset has and where the models live. An evaluation therefore always measures the deployed
# configuration.

cameras:
  - namespace: camera4
    camera_info_topic: /sensing/camera/camera4/camera_info
    compressed_image_topic: /sensing/camera/camera4/image_raw/compressed
    output_topics:
      traffic_signals: /perception/traffic_light_recognition/camera4/classification/traffic_signals
      rois: /perception/traffic_light_recognition/camera4/detection/rois

  - namespace: camera5
    camera_info_topic: /sensing/camera/camera5/camera_info
    compressed_image_topic: /sensing/camera/camera5/image_raw/compressed
    output_topics:
      traffic_signals: /perception/traffic_light_recognition/camera5/classification/traffic_signals
      rois: /perception/traffic_light_recognition/camera5/detection/rois

# Model/label paths only -- the thresholds come from config/traffic_light_recognition.param.yaml.
# These paths live under the user's $HOME rather than in a package share directory, so they are a
# property of the machine the evaluation runs on, not of the pipeline's tuning, and are
# deliberately absent from that config file (the launch file injects them the same way).
recognition:
  whole_image_detector:
    model_path: ~/autoware_data/tensorrt_yolox/yolox_s_car_ped_tl_detector_960_960_batch_1.onnx
    label_path: ~/autoware_data/tensorrt_yolox/car_ped_tl_detector_labels.txt
    # roi_remap_path is omitted, so it falls back to the traffic_light_roi_label_remap.csv installed
    # by autoware_tensorrt_yolox itself (see run_traffic_light_recognition_evaluation.cpp).

  car_classifier:
    model_path: ~/autoware_data/traffic_light_classifier/traffic_light_classifier_mobilenetv2_batch_6.onnx
    label_path: ~/autoware_data/traffic_light_classifier/lamp_labels.txt

  pedestrian_classifier:
    model_path: ~/autoware_data/traffic_light_classifier/ped_traffic_light_classifier_mobilenetv2_batch_6.onnx
    label_path: ~/autoware_data/traffic_light_classifier/lamp_labels_ped.txt

fusion:
  # The one back-end setting that has no package default: where the evaluation writes the fused
  # result. Everything else (multi_camera_fusion.*, arbiter.*) comes from
  # config/traffic_light_fusion.param.yaml.
  output_topic: /perception/traffic_light_recognition/internal/traffic_signals
