# Evaluation config for the x2 vehicle (sensor kit v4.4, camera6/camera7).
#
# input_bag / lanelet2_map / map_projector_info are derived from --dataset, not listed here:
# every dataset uses the fixed layout <dataset>/input_bag, <dataset>/map/lanelet2_map.osm,
# <dataset>/map/map_projector_info.yaml.
#
# Run with:
#   ros2 run autoware_traffic_light_pipeline run_traffic_light_recognition_evaluation \
#     --config <this file> \
#     --dataset <t4dataset dir> \
#     --output-bag result/output_bag

# One TrafficLightRecognition instance per entry.
cameras:
  - namespace: camera4
    camera_info_topic: /sensing/camera/camera4/camera_info
    compressed_image_topic: /sensing/camera/camera4/image_raw/compressed
    image_topic: null # 非圧縮画像を使う場合はこちらを設定し compressed_image_topic を null にする
    output_topics:
      traffic_signals: /perception/traffic_light_recognition/camera4/classification/traffic_signals
      rois: /perception/traffic_light_recognition/camera4/detection/rois
    # map->camera tf のサンプリング窓。カメラごとに異なる唯一のパラメータ。
    map_based_detector:
      # -0.04, not the upstream package default -0.3: every x2 camera overrides it in
      # edge_auto_jetson_launch/launch/traffic_light_recognition/traffic_light_recognition.launch.xml.
      min_timestamp_offset: -0.04
      max_timestamp_offset: 0.0

  - namespace: camera5
    camera_info_topic: /sensing/camera/camera5/camera_info
    compressed_image_topic: /sensing/camera/camera5/image_raw/compressed
    image_topic: null
    output_topics:
      traffic_signals: /perception/traffic_light_recognition/camera5/classification/traffic_signals
      rois: /perception/traffic_light_recognition/camera5/detection/rois
    map_based_detector:
      # -0.04, not the upstream package default -0.3: every x2 camera overrides it in
      # edge_auto_jetson_launch/launch/traffic_light_recognition/traffic_light_recognition.launch.xml.
      min_timestamp_offset: -0.04
      max_timestamp_offset: 0.0

# 全カメラ共通の TrafficLightRecognitionConfig。閾値は config/traffic_light_recognition.param.yaml
# と、model_path / label_path 類は launch/traffic_light_recognition.launch.xml と同じ値を置く。
# モデル/ラベルは本番(webauto CI)と同じ /opt/autoware/mlmodels 配下の ML package 実体を指す。
# ~/autoware_data/ にも同じ .onnx (md5 一致) があるが、そちらには古い TensorRT で焼かれた
# .engine がキャッシュとして同居しており、それを読むと fp16 の演算結果がわずかに変わる
# (例: confidence が 0.99998 ではなく厳密に 1.0 になる)。multi_camera_fusion の
# has_higher_or_equal_priority() は同 confidence 時に「後から来た record を採用」する
# 厳密比較なので、この差だけで融合結果の色が変わってしまう。engine を本番と共有するために
# パスごと合わせる。
recognition:
  whole_image_detector:
    model_path: /opt/autoware/mlmodels/tensorrt_yolox/yolox_s_car_ped_tl_detector_960_960_batch_1.onnx
    label_path: /opt/autoware/mlmodels/tensorrt_yolox/car_ped_tl_detector_labels.txt
    # roi_remap_path is omitted: it defaults to autoware_tensorrt_yolox's own installed
    # traffic_light_roi_label_remap.csv (see run_traffic_light_recognition_evaluation.cpp).
    score_threshold: 0.35
    nms_threshold: 0.7

  car_classifier:
    model_path: /opt/autoware/mlmodels/traffic_light_classifier/traffic_light_classifier_mobilenetv2_batch_6.onnx
    label_path: /opt/autoware/mlmodels/traffic_light_classifier/lamp_labels.txt

  pedestrian_classifier:
    model_path: /opt/autoware/mlmodels/traffic_light_classifier/ped_traffic_light_classifier_mobilenetv2_batch_6.onnx
    label_path: /opt/autoware/mlmodels/traffic_light_classifier/lamp_labels_ped.txt

  classifier:
    over_exposure_threshold: 0.85
    under_exposure_threshold: -0.83

# 後段（fusion）の設定。run_traffic_light_pipeline_evaluation でのみ使用する。
# crosswalk_estimator は traffic_light_fusion_node.cpp の declare_fusion_config() と同じ固定値を
# ツール側でハードコードしており(本番でも parameter 化されていない)、ここに書くのは parameter
# 化されている multi_camera_fusion.* / arbiter.* のみ
# (config/traffic_light_fusion.param.yaml と同値)。
fusion:
  output_topic: /perception/traffic_light_recognition/internal/traffic_signals

  multi_camera_fusion:
    # 0.12。upstream パッケージのデフォルト 0.09 ではなく autoware_launch/config/perception/
    # traffic_light_recognition/traffic_light_multi_camera_fusion/*.param.yaml の実デプロイ値。
    # カメラ周期 0.100005s より大きくないと、前フレームの他カメラ record が必ず期限切れになり
    # 各トリガが単眼結果を publish してしまう。
    message_lifespan: 0.12
    prior_log_odds: 0.0

  arbiter:
    external_delay_tolerance: 5.0
    external_time_tolerance: 5.0
    perception_time_tolerance: 1.0
    source_priority: perception
    enable_signal_matching: false
    prioritize_internal_signals_when_arrows_present: true
